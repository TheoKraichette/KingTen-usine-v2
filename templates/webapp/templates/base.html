<!DOCTYPE html>
<html lang="fr">
<head>

    <title>{% block title %}{{ title }}{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/htmx.min.js" defer></script>
</head>
<body>

</html>
