# Contrat usine v2 : le site écoute sur le port 8000.
server {
    listen 8000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        # =404 (pas de fallback index.html) : les fichiers manquants et routes
        # fantômes doivent être détectés par la validation mécanique
        try_files $uri $uri/ =404;
    }
}
